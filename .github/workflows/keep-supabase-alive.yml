name: Keep Supabase awake

# Supabase free-tier projects pause after ~7 days of inactivity, which forces a
# manual restore. This job pings the project's database every couple of days so
# it always looks active and never pauses.
#
# One-time setup — add two repository secrets
# (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_URL       your Project URL, e.g. https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (the same one the app uses)
#
# The anon key is safe to store here — it's the public key the browser app
# already ships, and it's protected by row-level security.

on:
  schedule:
    # every 2 days at 06:17 UTC (well under the 7-day pause window, with margin
    # in case GitHub delays or skips a run)
    - cron: '17 6 */2 * *'
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # A lightweight query against the app_state table. Row-level security
          # returns no rows for the anon key, but the request still registers
          # database + API activity, which is what keeps the project awake.
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/app_state?select=user_id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP ${code}."
          # Any answer below 500 means the project is up and served the request.
          if [ "${code}" -ge 500 ]; then
            echo "::error::Supabase returned a server error (${code})."
            exit 1
          fi
          echo "✓ Ping succeeded — project kept awake."
